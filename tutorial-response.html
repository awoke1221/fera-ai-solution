?bc7326a03241bd2e\"}]]\n"])</script><script>self.__next_f.push([1,"3:null\n"])</script><script>self.__next_f.push([1,"f:I[\"(app-pages-browser)/./app/components/site-shell.tsx\",[\"app/tutorials/[slug]/page\",\"static/chunks/app/tutorials/%5Bslug%5D/page.js\"],\"SiteShell\"]\n10:I[\"(app-pages-browser)/./node_modules/next/dist/client/link.js\",[\"app/tutorials/[slug]/page\",\"static/chunks/app/tutorials/%5Bslug%5D/page.js\"],\"\"]\n11:T3ed1,"])</script><script>self.__next_f.push([1,"\u003ch1\u003eTypeScript Mastery for Enterprise Applications\u003c/h1\u003e\n\u003cp\u003eMaster advanced TypeScript patterns and techniques for building production-grade enterprise applications with complete type safety.\u003c/p\u003e\n\u003ch2\u003ePart 1: Advanced Type System\u003c/h2\u003e\n\u003ch3\u003e1. Generic Types \u0026#x26; Constraints\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eBuilding reusable, type-safe components\u003c/strong\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e// Generic with type constraints\r\ninterface Repository\u0026#x3C;T extends { id: number }\u003e {\r\n  find(id: number): Promise\u0026#x3C;T | null\u003e;\r\n  save(item: T): Promise\u0026#x3C;void\u003e;\r\n  delete(id: number): Promise\u0026#x3C;void\u003e;\r\n}\r\n\r\n// Concrete implementation\r\ninterface User {\r\n  id: number;\r\n  name: string;\r\n  email: string;\r\n}\r\n\r\nclass UserRepository implements Repository\u0026#x3C;User\u003e {\r\n  async find(id: number): Promise\u0026#x3C;User | null\u003e {\r\n    // Implementation\r\n    return null;\r\n  }\r\n\r\n  async save(user: User): Promise\u0026#x3C;void\u003e {\r\n    // Implementation\r\n  }\r\n\r\n  async delete(id: number): Promise\u0026#x3C;void\u003e {\r\n    // Implementation\r\n  }\r\n}\r\n\r\n// Generic function with multiple constraints\r\nfunction merge\u0026#x3C;T extends object, U extends object\u003e(obj1: T, obj2: U): T \u0026#x26; U {\r\n  return { ...obj1, ...obj2 } as T \u0026#x26; U;\r\n}\r\n\r\nconst result = merge({ id: 1, name: \"Alice\" }, { email: \"alice@example.com\" });\r\n// result: { id: 1; name: 'Alice'; email: 'alice@example.com' }\r\n\r\n// Conditional types (ternary for types)\r\ntype Flatten\u0026#x3C;T\u003e = T extends Array\u0026#x3C;infer U\u003e ? U : T;\r\n\r\ntype Str = Flatten\u0026#x3C;string[]\u003e; // string\r\ntype Num = Flatten\u0026#x3C;number\u003e; // number\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e2. Utility Types \u0026#x26; Type Manipulation\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eBuilt-in and custom utility types\u003c/strong\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e// Extract readonly properties\r\ntype ReadonlyKeys\u0026#x3C;T\u003e = {\r\n  [K in keyof T]-?: T[K] extends Readonly\u0026#x3C;any\u003e ? K : never;\r\n}[keyof T];\r\n\r\n// Getters and setters\r\ntype Getter\u0026#x3C;T\u003e = {\r\n  [K in keyof T as `get${Capitalize\u0026#x3C;string \u0026#x26; K\u003e}`]: () =\u003e T[K];\r\n};\r\n\r\ntype User = { id: number; name: string };\r\ntype UserGetters = Getter\u0026#x3C;User\u003e;\r\n// Result: { getId: () =\u003e number; getName: () =\u003e string }\r\n\r\n// Deep readonly\r\ntype DeepReadonly\u0026#x3C;T\u003e = {\r\n  readonly [P in keyof T]: T[P] extends object ? DeepReadonly\u0026#x3C;T[P]\u003e : T[P];\r\n};\r\n\r\nconst user: DeepReadonly\u0026#x3C;{\r\n  id: number;\r\n  profile: { name: string };\r\n}\u003e = {\r\n  id: 1,\r\n  profile: { name: \"Alice\" },\r\n};\r\n\r\n// Can't modify\r\n// user.id = 2; // Error\r\n// user.profile.name = 'Bob'; // Error\r\n\r\n// Omit multiple keys\r\ntype OmitKeys\u0026#x3C;T, K extends keyof T\u003e = Pick\u0026#x3C;T, Exclude\u0026#x3C;keyof T, K\u003e\u003e;\r\n\r\ntype UserWithoutEmail = OmitKeys\u0026#x3C;User, \"email\" | \"phone\"\u003e;\r\n\r\n// Recursive partial\r\ntype DeepPartial\u0026#x3C;T\u003e = {\r\n  [P in keyof T]?: T[P] extends object ? DeepPartial\u0026#x3C;T[P]\u003e : T[P];\r\n};\r\n\r\n// Strict optional properties\r\ntype StrictOmit\u0026#x3C;T, K extends keyof T\u003e = Pick\u0026#x3C;T, Exclude\u0026#x3C;keyof T, K\u003e\u003e;\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e3. Advanced Pattern Matching\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eDiscriminated unions for type safety\u003c/strong\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e// Error handling with discriminated unions\r\ntype Success\u0026#x3C;T\u003e = { status: \"success\"; data: T };\r\ntype Error = { status: \"error\"; message: string; code: number };\r\ntype Result\u0026#x3C;T\u003e = Success\u0026#x3C;T\u003e | Error;\r\n\r\nfunction handleResult\u0026#x3C;T\u003e(result: Result\u0026#x3C;T\u003e): void {\r\n  if (result.status === \"success\") {\r\n    // TypeScript knows result.data exists here\r\n    console.log(\"Success:\", result.data);\r\n  } else {\r\n    // TypeScript knows result.message exists here\r\n    console.log(\"Error:\", result.message);\r\n  }\r\n}\r\n\r\n// API response patterns\r\ntype ApiResponse\u0026#x3C;T\u003e =\r\n  | { status: 200; data: T }\r\n  | { status: 400; error: \"ValidationError\"; details: string[] }\r\n  | { status: 401; error: \"Unauthorized\" }\r\n  | { status: 404; error: \"NotFound\" }\r\n  | { status: 500; error: \"InternalError\"; requestId: string };\r\n\r\nfunction parseResponse\u0026#x3C;T\u003e(response: ApiResponse\u0026#x3C;T\u003e): T {\r\n  switch (response.status) {\r\n    case 200:\r\n      return response.data;\r\n    case 400:\r\n      throw new Error(`Validation failed: ${response.details.join(\", \")}`);\r\n    case 401:\r\n      throw new Error(\"Authentication required\");\r\n    case 404:\r\n      throw new Error(\"Not found\");\r\n    case 500:\r\n      throw new Error(`Server error (${response.requestId})`);\r\n  }\r\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e4. Template Literal Types\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eString literal types for compile-time safety\u003c/strong\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e// Build URLs at compile time\r\ntype HttpMethod = \"GET\" | \"POST\" | \"PUT\" | \"DELETE\";\r\ntype Route = `/${string}`;\r\n\r\ntype ApiEndpoint = `${HttpMethod} ${Route}`;\r\n\r\nconst endpoint1: ApiEndpoint = \"GET /users\"; // ✓\r\nconst endpoint2: ApiEndpoint = \"POST /users\"; // ✓\r\n// const endpoint3: ApiEndpoint = 'PATCH /users'; // Error\r\n\r\n// Event names with type safety\r\ntype EventMap = {\r\n  \"user:login\": { userId: number };\r\n  \"user:logout\": { reason: string };\r\n  \"page:navigate\": { from: string; to: string };\r\n};\r\n\r\ntype EventName = keyof EventMap;\r\ntype EventPayload\u0026#x3C;E extends EventName\u003e = EventMap[E];\r\n\r\n// Type-safe event emitter\r\nclass TypedEventEmitter {\r\n  on\u0026#x3C;E extends EventName\u003e(\r\n    event: E,\r\n    handler: (payload: EventPayload\u0026#x3C;E\u003e) =\u003e void,\r\n  ) {\r\n    // Implementation\r\n  }\r\n\r\n  emit\u0026#x3C;E extends EventName\u003e(event: E, payload: EventPayload\u0026#x3C;E\u003e) {\r\n    // Implementation\r\n  }\r\n}\r\n\r\nconst emitter = new TypedEventEmitter();\r\nemitter.on(\"user:login\", (payload) =\u003e {\r\n  console.log(payload.userId); // Valid\r\n  // console.log(payload.reason); // Error\r\n});\r\n\r\n// String validation with types\r\ntype ValidEmail = string \u0026#x26; { readonly __brand: \"ValidEmail\" };\r\ntype ValidUrl = string \u0026#x26; { readonly __brand: \"ValidUrl\" };\r\n\r\nfunction validateEmail(email: string): email is ValidEmail {\r\n  return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);\r\n}\r\n\r\nfunction validateUrl(url: string): url is ValidUrl {\r\n  try {\r\n    new URL(url);\r\n    return true;\r\n  } catch {\r\n    return false;\r\n  }\r\n}\r\n\r\nlet email = \"user@example.com\";\r\nif (validateEmail(email)) {\r\n  // TypeScript now treats email as ValidEmail\r\n  const validEmail: ValidEmail = email;\r\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003ePart 2: Advanced Patterns\u003c/h2\u003e\n\u003ch3\u003e1. Builder Pattern with Type Safety\u003c/h3\u003e\n\u003cpre\u003e\u003ccode\u003einterface PageConfig {\r\n  title: string;\r\n  description: string;\r\n  keywords: string[];\r\n  ogImage?: string;\r\n  canonical?: string;\r\n}\r\n\r\nclass PageBuilder {\r\n  private config: Partial\u0026#x3C;PageConfig\u003e = {};\r\n\r\n  setTitle(title: string): this {\r\n    this.config.title = title;\r\n    return this;\r\n  }\r\n\r\n  setDescription(description: string): this {\r\n    this.config.description = description;\r\n    return this;\r\n  }\r\n\r\n  addKeyword(keyword: string): this {\r\n    this.config.keywords ??= [];\r\n    this.config.keywords.push(keyword);\r\n    return this;\r\n  }\r\n\r\n  setOgImage(url: string): this {\r\n    this.config.ogImage = url;\r\n    return this;\r\n  }\r\n\r\n  setCanonical(url: string): this {\r\n    this.config.canonical = url;\r\n    return this;\r\n  }\r\n\r\n  build(): PageConfig {\r\n    if (\r\n      !this.config.title ||\r\n      !this.config.description ||\r\n      !this.config.keywords\r\n    ) {\r\n      throw new Error(\"Missing required fields\");\r\n    }\r\n    return this.config as PageConfig;\r\n  }\r\n}\r\n\r\n// Usage\r\nconst page = new PageBuilder()\r\n  .setTitle(\"My Blog\")\r\n  .setDescription(\"A blog about web development\")\r\n  .addKeyword(\"typescript\")\r\n  .addKeyword(\"web-development\")\r\n  .setOgImage(\"https://example.com/og.jpg\")\r\n  .build();\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e2. Dependency Injection Container\u003c/h3\u003e\n\u003cpre\u003e\u003ccode\u003etype Constructor\u0026#x3C;T\u003e = new (...args: any[]) =\u003e T;\r\ntype ServiceFactory\u0026#x3C;T\u003e = (...args: any[]) =\u003e T;\r\n\r\nclass DIContainer {\r\n  private services = new Map\u0026#x3C;string, any\u003e();\r\n  private singletons = new Map\u0026#x3C;string, any\u003e();\r\n\r\n  register\u0026#x3C;T\u003e(key: string, factory: ServiceFactory\u0026#x3C;T\u003e, singleton = false) {\r\n    if (singleton) {\r\n      this.services.set(key, () =\u003e {\r\n        if (!this.singletons.has(key)) {\r\n          this.singletons.set(key, factory());\r\n        }\r\n        return this.singletons.get(key);\r\n      });\r\n    } else {\r\n      this.services.set(key, factory);\r\n    }\r\n    return this;\r\n  }\r\n\r\n  registerClass\u0026#x3C;T\u003e(\r\n    key: string,\r\n    constructor: Constructor\u0026#x3C;T\u003e,\r\n    singleton = false,\r\n  ) {\r\n    return this.register(key, () =\u003e new constructor(), singleton);\r\n  }\r\n\r\n  get\u0026#x3C;T\u003e(key: string): T {\r\n    const factory = this.services.get(key);\r\n    if (!factory) {\r\n      throw new Error(`Service not found: ${key}`);\r\n    }\r\n    return factory();\r\n  }\r\n}\r\n\r\n// Usage\r\nclass DatabaseService {\r\n  connect() {\r\n    console.log(\"Connected to database\");\r\n  }\r\n}\r\n\r\nclass UserService {\r\n  constructor(private db: DatabaseService) {}\r\n\r\n  getUser(id: number) {\r\n    console.log(`Getting user ${id}`);\r\n  }\r\n}\r\n\r\nconst container = new DIContainer();\r\ncontainer.registerClass(\"db\", DatabaseService, true);\r\ncontainer.register(\r\n  \"userService\",\r\n  () =\u003e {\r\n    return new UserService(container.get\u0026#x3C;DatabaseService\u003e(\"db\"));\r\n  },\r\n  true,\r\n);\r\n\r\nconst userService = container.get\u0026#x3C;UserService\u003e(\"userService\");\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e3. Result Type for Error Handling\u003c/h3\u003e\n\u003cpre\u003e\u003ccode\u003etype Ok\u0026#x3C;T\u003e = { kind: \"ok\"; value: T };\r\ntype Err\u0026#x3C;E\u003e = { kind: \"err\"; error: E };\r\ntype Result\u0026#x3C;T, E\u003e = Ok\u0026#x3C;T\u003e | Err\u0026#x3C;E\u003e;\r\n\r\nclass ResultError\u0026#x3C;T, E\u003e {\r\n  static ok\u0026#x3C;T, E\u003e(value: T): Result\u0026#x3C;T, E\u003e {\r\n    return { kind: \"ok\", value };\r\n  }\r\n\r\n  static err\u0026#x3C;T, E\u003e(error: E): Result\u0026#x3C;T, E\u003e {\r\n    return { kind: \"err\", error };\r\n  }\r\n\r\n  static isOk\u0026#x3C;T, E\u003e(result: Result\u0026#x3C;T, E\u003e): result is Ok\u0026#x3C;T\u003e {\r\n    return result.kind === \"ok\";\r\n  }\r\n\r\n  static isErr\u0026#x3C;T, E\u003e(result: Result\u0026#x3C;T, E\u003e): result is Err\u0026#x3C;E\u003e {\r\n    return result.kind === \"err\";\r\n  }\r\n\r\n  static map\u0026#x3C;T, E, U\u003e(result: Result\u0026#x3C;T, E\u003e, fn: (value: T) =\u003e U): Result\u0026#x3C;U, E\u003e {\r\n    return result.kind === \"ok\"\r\n      ? { kind: \"ok\", value: fn(result.value) }\r\n      : result;\r\n  }\r\n\r\n  static flatMap\u0026#x3C;T, E, U\u003e(\r\n    result: Result\u0026#x3C;T, E\u003e,\r\n    fn: (value: T) =\u003e Result\u0026#x3C;U, E\u003e,\r\n  ): Result\u0026#x3C;U, E\u003e {\r\n    return result.kind === \"ok\" ? fn(result.value) : result;\r\n  }\r\n\r\n  static getOrElse\u0026#x3C;T, E\u003e(result: Result\u0026#x3C;T, E\u003e, defaultValue: T): T {\r\n    return result.kind === \"ok\" ? result.value : defaultValue;\r\n  }\r\n}\r\n\r\n// Usage\r\nfunction parseJson(json: string): Result\u0026#x3C;unknown, string\u003e {\r\n  try {\r\n    return ResultError.ok(JSON.parse(json));\r\n  } catch (e) {\r\n    return ResultError.err(\"Invalid JSON\");\r\n  }\r\n}\r\n\r\nconst result = parseJson('{\"name\": \"Alice\"}');\r\n\r\nif (ResultError.isOk(result)) {\r\n  console.log(\"Parsed:\", result.value);\r\n} else {\r\n  console.error(\"Error:\", result.error);\r\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003ePart 3: Architecture Patterns\u003c/h2\u003e\n\u003ch3\u003e1. Clean Architecture Layers\u003c/h3\u003e\n\u003cpre\u003e\u003ccode\u003e// Domain layer - business logic\r\ninterface User {\r\n  id: number;\r\n  name: string;\r\n  email: string;\r\n}\r\n\r\nclass UserDomain {\r\n  static validateEmail(email: string): boolean {\r\n    return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);\r\n  }\r\n\r\n  static create(name: string, email: string): Result\u0026#x3C;User, string\u003e {\r\n    if (!name.trim()) {\r\n      return ResultError.err(\"Name is required\");\r\n    }\r\n    if (!this.validateEmail(email)) {\r\n      return ResultError.err(\"Invalid email\");\r\n    }\r\n    return ResultError.ok({ id: 0, name, email });\r\n  }\r\n}\r\n\r\n// Data layer - data access\r\ninterface UserRepository {\r\n  save(user: User): Promise\u0026#x3C;User\u003e;\r\n  findById(id: number): Promise\u0026#x3C;User | null\u003e;\r\n}\r\n\r\nclass UserRepositoryImpl implements UserRepository {\r\n  async save(user: User): Promise\u0026#x3C;User\u003e {\r\n    // Call API or database\r\n    return user;\r\n  }\r\n\r\n  async findById(id: number): Promise\u0026#x3C;User | null\u003e {\r\n    // Fetch from database\r\n    return null;\r\n  }\r\n}\r\n\r\n// Application layer - use cases\r\nclass CreateUserUseCase {\r\n  constructor(private userRepository: UserRepository) {}\r\n\r\n  async execute(name: string, email: string): Promise\u0026#x3C;Result\u0026#x3C;User, string\u003e\u003e {\r\n    const userResult = UserDomain.create(name, email);\r\n\r\n    if (!ResultError.isOk(userResult)) {\r\n      return userResult;\r\n    }\r\n\r\n    try {\r\n      const savedUser = await this.userRepository.save(userResult.value);\r\n      return ResultError.ok(savedUser);\r\n    } catch (error) {\r\n      return ResultError.err(\"Failed to save user\");\r\n    }\r\n  }\r\n}\r\n\r\n// Presentation layer - API/UI\r\nclass UserController {\r\n  constructor(private createUserUseCase: CreateUserUseCase) {}\r\n\r\n  async handleCreateUser(req: any): Promise\u0026#x3C;any\u003e {\r\n    const result = await this.createUserUseCase.execute(\r\n      req.body.name,\r\n      req.body.email,\r\n    );\r\n\r\n    if (ResultError.isOk(result)) {\r\n      return { status: 201, body: result.value };\r\n    } else {\r\n      return { status: 400, body: { error: result.error } };\r\n    }\r\n  }\r\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e2. Plugin Architecture\u003c/h3\u003e\n\u003cpre\u003e\u003ccode\u003e// Core plugin interface\r\ninterface Plugin {\r\n  name: string;\r\n  version: string;\r\n  install(app: Application): void;\r\n}\r\n\r\ninterface ApplicationHooks {\r\n  beforeLoad: (path: string) =\u003e Promise\u0026#x3C;void\u003e[];\r\n  afterLoad: (data: any) =\u003e Promise\u0026#x3C;void\u003e[];\r\n}\r\n\r\nclass Application {\r\n  private plugins: Plugin[] = [];\r\n  private hooks: Map\u0026#x3C;string, Function[]\u003e = new Map();\r\n\r\n  use(plugin: Plugin): this {\r\n    this.plugins.push(plugin);\r\n    plugin.install(this);\r\n    return this;\r\n  }\r\n\r\n  on\u0026#x3C;K extends keyof ApplicationHooks\u003e(\r\n    hook: K,\r\n    handler: ApplicationHooks[K],\r\n  ): this {\r\n    if (!this.hooks.has(hook)) {\r\n      this.hooks.set(hook, []);\r\n    }\r\n    this.hooks.get(hook)!.push(handler as Function);\r\n    return this;\r\n  }\r\n\r\n  async runHook\u0026#x3C;K extends keyof ApplicationHooks\u003e(\r\n    hook: K,\r\n    ...args: any[]\r\n  ): Promise\u0026#x3C;void\u003e {\r\n    const handlers = this.hooks.get(hook as string) || [];\r\n    for (const handler of handlers) {\r\n      await (handler as Function)(...args);\r\n    }\r\n  }\r\n}\r\n\r\n// Example plugin\r\nclass LoggingPlugin implements Plugin {\r\n  name = \"Logging\";\r\n  version = \"1.0.0\";\r\n\r\n  install(app: Application): void {\r\n    app.on(\"beforeLoad\", async (path) =\u003e {\r\n      console.log(`Loading: ${path}`);\r\n    });\r\n\r\n    app.on(\"afterLoad\", async (data) =\u003e {\r\n      console.log(`Loaded data:`, data);\r\n    });\r\n  }\r\n}\r\n\r\n// Usage\r\nconst app = new Application();\r\napp.use(new LoggingPlugin());\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003ePart 4: Module Resolution \u0026#x26; Configuration\u003c/h2\u003e\n\u003ch3\u003eTypeScript Configuration Best Practices\u003c/h3\u003e\n\u003cpre\u003e\u003ccode\u003e{\r\n  \"compilerOptions\": {\r\n    // Strict mode - enables all strict type-checking options\r\n    \"strict\": true,\r\n    \"noImplicitAny\": true,\r\n    \"strictNullChecks\": true,\r\n    \"strictFunctionTypes\": true,\r\n    \"strictPropertyInitialization\": true,\r\n    \"noImplicitThis\": true,\r\n    \"alwaysStrict\": true,\r\n\r\n    // Module resolution\r\n    \"module\": \"esnext\",\r\n    \"moduleResolution\": \"node\",\r\n    \"resolveJsonModule\": true,\r\n    \"esModuleInterop\": true,\r\n    \"allowSyntheticDefaultImports\": true,\r\n\r\n    // Paths for clean imports\r\n    \"baseUrl\": \".\",\r\n    \"paths\": {\r\n      \"@/*\": [\"src/*\"],\r\n      \"@components/*\": [\"src/components/*\"],\r\n      \"@utils/*\": [\"src/utils/*\"],\r\n      \"@types/*\": [\"src/types/*\"]\r\n    },\r\n\r\n    // Output configuration\r\n    \"outDir\": \"./dist\",\r\n    \"rootDir\": \"./src\",\r\n    \"declaration\": true,\r\n    \"declarationMap\": true,\r\n    \"sourceMap\": true,\r\n\r\n    // Performance\r\n    \"skipLibCheck\": true,\r\n    \"forceConsistentCasingInFileNames\": true\r\n  },\r\n  \"include\": [\"src/**/*\"],\r\n  \"exclude\": [\"node_modules\", \"dist\", \"**/*.test.ts\"]\r\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003eSummary Checklist\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e[ ] Generic types with constraints mastered\u003c/li\u003e\n\u003cli\u003e[ ] Utility types and type manipulation understood\u003c/li\u003e\n\u003cli\u003e[ ] Discriminated unions used for error handling\u003c/li\u003e\n\u003cli\u003e[ ] Template literal types implemented\u003c/li\u003e\n\u003cli\u003e[ ] Builder pattern with type safety\u003c/li\u003e\n\u003cli\u003e[ ] Dependency injection container\u003c/li\u003e\n\u003cli\u003e[ ] Result type for functional error handling\u003c/li\u003e\n\u003cli\u003e[ ] Clean architecture layers separated\u003c/li\u003e\n\u003cli\u003e[ ] Plugin architecture for extensibility\u003c/li\u003e\n\u003cli\u003e[ ] TypeScript configuration optimized\u003c/li\u003e\
